services:
  - type: web
    name: smart-parking-management
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SMART_PARKING_SECRET_KEY
        generateValue: true
